<footer class="pie">
  <div class="contenedor-pagina">
    <div class="pie__contenedor">
      <div>
        <h2 class="pie__titulo" i18n="Titulo del bloque de contacto del pie@@pie.contacto">Contacto</h2>
        <p class="pie__dato">
          <span i18n="Etiqueta del telefono de contacto@@pie.telefono">Teléfono:</span>
          <a href="tel:+34688757782">34 688 75 77 82</a>
        </p>
        <p class="pie__dato">
          <span i18n="Etiqueta del email de contacto@@pie.email">Email:</span>
          <a href="mailto:veronica@cookyourwebai.es">veronica&#64;cookyourwebai.es</a>
        </p>
      </div>
  
      <div class="pie__derechos">
        <p>{{ derechos }}</p>
        @if (legales.length > 0) {
          <nav class="pie__legales" [attr.aria-label]="etiquetaLegales">
            @for (enlace of legales; track enlace.clave; let primero = $first) {
              @if (!primero) {
                <span aria-hidden="true">·</span>
              }
              <a class="pie__legal" [class.pie__legal--baja]="enlace.clave === 'baja'" [href]="enlace.url">{{ enlace.etiqueta }}</a>
            }
          </nav>
        }
      </div>
    </div>
  </div>

  <p class="pie__hecho">{{ hechoCon[0] }}<span class="pie__corazon" aria-hidden="true">&#10084;</span>{{ hechoCon[1] }}</p>
  <p class="pie__proyecto">
    <a [href]="agencia" i18n="Enlace del pie a la web de la agencia@@pie.proyecto">Un proyecto de CookYourWeb AI</a>
  </p>
</footer>
