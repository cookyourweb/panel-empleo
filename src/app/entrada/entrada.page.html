<article class="entrada">
  <h2>Entrar</h2>
  <p>Entra con tu cuenta para ver tus candidaturas.</p>

  <div #acceso data-acceso></div>

  <!-- La region existe siempre: un role="status" que nace ya con texto no se
       anuncia de forma fiable. Solo cambia el texto de dentro. -->
  <div class="aviso" role="status">
    @if (despertando()) {
      <p>Despertando el servidor, puede tardar un minuto</p>
    }
    @if (sinRespuesta()) {
      <p>El servidor no ha respondido. Prueba de nuevo.</p>
    }
  </div>

  @if (sinRespuesta()) {
    <button type="button" (click)="reintentar()">Reintentar</button>
  }

  @if (error(); as mensaje) {
    <p class="error" role="alert">{{ mensaje }}</p>
  }
</article>
