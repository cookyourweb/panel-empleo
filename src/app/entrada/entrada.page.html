<article class="entrada">
  <h2 i18n="Titulo de la pantalla de entrada@@entrada.titulo">Entrar</h2>
  <p i18n="Invitacion a entrar con la cuenta@@entrada.invitacion">Entra con tu cuenta para ver tus candidaturas.</p>

  <div #acceso data-acceso></div>

  <!-- La region existe siempre: un role="status" que nace ya con texto no se
       anuncia de forma fiable. Solo cambia el texto de dentro. -->
  <div class="aviso" role="status">
    @if (despertando()) {
      <p i18n="Aviso de que el servidor esta arrancando@@entrada.despertando">Despertando el servidor, puede tardar un minuto</p>
    }
    @if (sinRespuesta()) {
      <p i18n="Aviso de que el servidor no respondio@@entrada.sinRespuesta">El servidor no ha respondido. Prueba de nuevo.</p>
    }
  </div>

  @if (sinRespuesta()) {
    <button type="button" (click)="reintentar()" i18n="Boton que vuelve a comprobar el servidor@@entrada.reintentar">
      Reintentar
    </button>
  }

  @if (error(); as mensaje) {
    <p class="error" role="alert">{{ mensaje }}</p>
  }
</article>
