<a class="salto-al-contenido" href="#contenido" i18n="Enlace para saltar la cabecera y llegar al contenido@@app.saltarAlContenido"
  >Saltar al contenido principal</a
>

<header class="cabecera">
  <h1>{{ titulo() }}</h1>
  @if (sesion.activa()) {
    <a routerLink="/cuenta" i18n="Enlace de la cabecera a la cuenta@@app.cuenta">Tu cuenta</a>
  }
  <app-selector-de-idioma />
</header>

<main #principal id="contenido" tabindex="-1">
  <router-outlet />
</main>
