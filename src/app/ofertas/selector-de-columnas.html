<button
  type="button"
  class="boton"
  data-columnas
  aria-haspopup="true"
  [attr.aria-expanded]="abierto()"
  aria-controls="selector-columnas"
  (click)="alternarDesplegable()"
>
  <ng-container i18n="Boton que abre el selector de columnas@@columnas.boton">Columnas</ng-container
  >&ngsp;<span class="recuento">{{ preferencias.visibles().size }}/{{ total }}</span>
</button>

@if (abierto()) {
  <div
    #desplegable
    id="selector-columnas"
    class="desplegable"
    data-selector
    role="group"
    aria-label="Columnas visibles"
    i18n-aria-label="Nombre del grupo de casillas de columnas@@columnas.etiqueta"
    (keydown.escape)="cerrarConTeclado($event)"
  >
    <div class="atajos">
      <button type="button" class="boton pequeno" (click)="preferencias.todas()" i18n="Boton que muestra todas las columnas@@columnas.todas">
        Todas
      </button>
      <button type="button" class="boton pequeno" (click)="preferencias.porDefecto()" i18n="Boton que restablece las columnas de serie@@columnas.porDefecto">
        Por defecto
      </button>
    </div>
    @for (grupo of grupos(); track grupo.grupo) {
      <fieldset>
        <legend>{{ titulo(grupo.grupo) }}</legend>
        <div class="rejilla">
          @for (item of grupo.columnas; track item.columna.clave) {
            <label>
              <input
                type="checkbox"
                [value]="item.columna.clave"
                [checked]="preferencias.visibles().has(item.columna.clave)"
                [disabled]="item.columna.fija"
                (change)="preferencias.alternar(item.columna.clave)"
              />
              <span>{{ item.columna.titulo }}</span>
              <span class="con-dato" [attr.data-con-dato]="item.columna.clave" title="Fichas con dato" i18n-title="Explica el numero junto a cada columna@@columnas.conDato">{{
                item.conDato
              }}</span>
            </label>
          }
        </div>
      </fieldset>
    }
  </div>
}
