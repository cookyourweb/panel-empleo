@if (candidatura(); as una) {
  <article>
    <p class="volver"><a routerLink="/">Volver a las candidaturas</a></p>

    <app-ficha-candidatura
      [candidatura]="una"
      [acciones]="acciones()"
      [opciones]="store.opcionesDeEdicion()"
      [alGuardar]="guardar"
    />
  </article>
} @else {
  <article>
    <h2>Esa candidatura no está</h2>
    <p>Puede que se haya borrado, o que el enlace no sea correcto.</p>
    <p><a routerLink="/">Volver a las candidaturas</a></p>
  </article>
}
