<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Panel de empleo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Absolute hrefs on purpose: each locale build sets <base href> to /es/ or /en/,
       and a relative one would resolve inside that folder (see vercel.json). -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Inter, la tipografia de CookYourWeb AI. Sin CSP en vercel.json, nada la bloquea. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
